name: Deploy ASP.NET + React App

on:
  push:
    branches:
      - production

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.201'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '21.x'

    - name: Install dependencies
      run: |
        dotnet restore
        cd soccerInfo.web.client
        npm install
        cd ../

    - name: Build ASP.NET App
      run: |
        dotnet publish -c Release -o publish --runtime linux-x64
        
    - name: Rename playwright folder
      run: |
        mv ./publish/.playwright ./publish/playwright
        
    - name: Upload build artifact
      uses: actions/upload-artifact@v3
      with:
        name: publish
        path: publish/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v3
      with:
        name: publish
        path: publish/

    - name: Copy files to VM
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_KEY }}
        source: publish/
        target: /var/www/app/
        strip_components: 1        
        overwrite: true
        
    - name: Rename playwright folder
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_KEY }}
        port: 22
        script: |
          cd /var/www/app
          sudo mv -f playwright .playwright
          
    - name: Restart Application on VM
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_KEY }}
        port: 22
        script: |
          sudo systemctl restart soccer-info.service
                  